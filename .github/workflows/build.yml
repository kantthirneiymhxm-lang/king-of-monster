name: Build Kaiju Mod

on:
  push:
  pull_request:
  workflow_dispatch:   # กดรันเองได้จากแท็บ Actions

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ในโปรเจกต์ไม่มี gradlew จึงใช้ Gradle 8.5 ตรง ๆ
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.5

      # ถ้าไฟล์โปรเจกต์อยู่ในโฟลเดอร์ kaiju-mod/ ให้ใส่ working-directory: kaiju-mod
      - name: Build
        run: gradle build --no-daemon

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: kaiju-mod
          path: build/libs/*.jar
