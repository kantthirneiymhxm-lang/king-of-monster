plugins { id 'fabric-loom' version '1.5-SNAPSHOT' }
version = '1.0.0'
group = 'com.kaiju'
base { archivesName = 'kaiju' }
repositories { maven { url 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/' } }
dependencies {
    minecraft "com.mojang:minecraft:1.20.1"
    mappings "net.fabricmc:yarn:1.20.1+build.10:v2"
    modImplementation "net.fabricmc:fabric-loader:0.15.11"
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.92.2+1.20.1"
    modImplementation "software.bernie.geckolib:geckolib-fabric-1.20.1:4.4.9"
}
tasks.withType(JavaCompile).configureEach { it.options.release = 17 }
java { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
